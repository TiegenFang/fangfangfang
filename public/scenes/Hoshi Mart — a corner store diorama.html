<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141232">
<title>Hoshi Mart — a corner store diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #141232;
    --panel: rgba(23, 20, 50, 0.88);
    --panel-solid: #1a1739;
    --panel-hi: rgba(48, 42, 98, 0.9);
    --line: #3d3876;
    --ink: #f4f2ff;
    --muted: #b3afdd;
    --mint: #4fe6c4;
    --mint-ink: #0b2a25;
    --gold: #ffd45e;
    --coral: #ff8f70;
    --r-lg: 16px; --r-md: 11px; --r-sm: 8px;
    --ui: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    --shadow: 0 10px 30px rgba(5, 4, 20, 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141232; --panel: rgba(23, 20, 50, 0.88); --ink: #f4f2ff; --muted: #b3afdd; }
  }
  :root[data-theme="dark"] { --bg: #141232; --panel: rgba(23, 20, 50, 0.88); --ink: #f4f2ff; --muted: #b3afdd; }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--ui); -webkit-font-smoothing: antialiased; }
  body.px { --r-lg: 0px; --r-md: 0px; --r-sm: 0px; --ui: "DotGothic16", "M PLUS Rounded 1c", monospace; --shadow: 4px 4px 0 rgba(5, 4, 20, 0.6); }

  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
  #stage.hover { cursor: pointer; }

  .panel { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  body.px .panel { background: var(--panel-solid); -webkit-backdrop-filter: none; backdrop-filter: none; border-width: 2px; }

  #brand { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; display: flex; gap: 10px; align-items: center; padding: 8px 14px 8px 10px; z-index: 3; }
  #brand svg { flex: none; }
  #brand strong { display: block; font-size: 17px; font-weight: 800; line-height: 1.2; }
  #brand .stats { display: flex; gap: 12px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  #brand .stats b { color: var(--ink); font-weight: 800; }

  #dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; gap: 6px; padding: 6px; max-width: calc(100vw - 16px); overflow-x: auto; scrollbar-width: none; z-index: 3; }
  #dock::-webkit-scrollbar { display: none; }
  .grp { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: var(--r-md); background: rgba(255, 255, 255, 0.045); flex: none; }
  .grp .lbl { font-size: 11px; color: var(--muted); padding: 0 6px 0 5px; }
  #dock button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 700; padding: 8px 11px; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap; line-height: 1; }
  #dock button:hover { color: var(--ink); background: rgba(255, 255, 255, 0.08); }
  #dock button[aria-pressed="true"] { background: var(--mint); color: var(--mint-ink); }
  #dock button.act { color: var(--ink); }
  #dock button.mini { padding: 8px 8px; font-size: 12px; }
  #pxSizes[hidden] { display: none; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); margin: 0; font-size: 12.5px; color: var(--ink); opacity: 0.85; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); pointer-events: none; text-align: center; max-width: 92vw; transition: opacity 0.8s; z-index: 2; }
  #hint.gone { opacity: 0; }

  #toast { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: 50%; transform: translate(-50%, -8px); padding: 9px 16px; font-size: 13px; font-weight: 700; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 4; max-width: min(440px, 90vw); text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  #pop { position: fixed; left: 0; top: 0; width: min(292px, calc(100vw - 24px)); padding: 14px 16px 16px; z-index: 5; }
  #pop[hidden] { display: none; }
  #pop h2 { margin: 0 30px 2px 0; font-size: 17px; font-weight: 800; line-height: 1.3; }
  #pop .lede { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.55; }
  #pop .x { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
  #pop .x:hover { color: var(--ink); background: rgba(255, 255, 255, 0.08); }
  .hero { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--panel-hi); margin-bottom: 12px; }
  .hero span { font-size: 14px; font-weight: 700; }
  .hero b { font-size: 22px; color: var(--gold); font-weight: 800; }
  .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .meter { height: 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.09); overflow: hidden; margin: 5px 0 12px; }
  .meter i { display: block; height: 100%; width: 0; background: var(--mint); transition: width 0.4s; }
  .meter.low i { background: var(--coral); }
  body.px .meter i { background: repeating-linear-gradient(90deg, var(--mint) 0 6px, transparent 6px 8px); }
  body.px .meter.low i { background: repeating-linear-gradient(90deg, var(--coral) 0 6px, transparent 6px 8px); }
  .list { list-style: none; margin: 0 0 12px; padding: 0; font-size: 13px; }
  .list li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); }
  .list li:last-child { border-bottom: 0; }
  .list li.on { color: var(--gold); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { appearance: none; border: 0; padding: 9px 14px; border-radius: var(--r-md); background: var(--mint); color: var(--mint-ink); font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
  .btn.ghost { background: rgba(255, 255, 255, 0.09); color: var(--ink); }
  .btn:disabled { opacity: 0.45; cursor: default; }

  #tags .tag { position: fixed; left: 0; top: 0; padding: 4px 9px; border-radius: 999px; background: #fffaf0; color: #24305e; font-size: 12px; font-weight: 800; white-space: nowrap; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35); pointer-events: none; z-index: 2; will-change: transform; }
  #tags .tag.low { background: #ffe1d8; color: #a33a22; }
  body.px #tags .tag { border-radius: 0; box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45); }
  #tags[hidden] { display: none; }

  #fail { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 15px; line-height: 1.6; color: var(--ink); }
  #fail[hidden] { display: none; }

  @media (max-width: 640px) {
    #brand { padding: 7px 11px 7px 8px; }
    #brand strong { font-size: 15px; }
    #brand .stats { flex-direction: column; gap: 0; }
    #dock { left: 8px; right: 8px; transform: none; max-width: none; }
    #dock button { padding: 8px 9px; font-size: 12px; }
    #hint { bottom: calc(env(safe-area-inset-bottom, 0px) + 70px); }
    #toast { top: calc(env(safe-area-inset-top, 0px) + 70px); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<canvas id="stage" tabindex="-1" aria-label="Interactive 3D diorama of a Japanese convenience store corner"></canvas>

<header id="brand" class="panel">
  <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="16" fill="#24305e"/><path d="M17 6.5l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L17 22.3l-6.4 3.6 1.5-7.1-5.4-4.9 7.2-.8z" fill="#ffd25a"/></svg>
  <div>
    <strong>ほしマート</strong>
    <div class="stats"><span><b id="sServed">0</b> customers served</span><span>Xiangxiang <b id="sHappy">70%</b> happy</span></div>
  </div>
</header>

<div id="toast" class="panel" role="status" aria-live="polite"></div>
<div id="tags" hidden></div>

<div id="pop" class="panel" role="dialog" aria-labelledby="popTitle" hidden>
  <button class="x" type="button" aria-label="Close">×</button>
  <div id="popBody"></div>
</div>

<p id="hint">Drag to orbit, right-drag to pan, scroll to zoom. Click Xiangxiang, a shelf, or a customer.</p>

<nav id="dock" class="panel" aria-label="Scene controls">
  <div class="grp" role="group" aria-label="Rendering style">
    <button type="button" data-style="native" aria-pressed="true">3D</button>
    <button type="button" data-style="pixel" aria-pressed="false">Pixel</button>
    <span id="pxSizes" hidden>
      <button type="button" class="mini" data-px="2" aria-pressed="true" aria-label="2 pixel cells">2px</button>
      <button type="button" class="mini" data-px="3" aria-pressed="false" aria-label="3 pixel cells">3px</button>
      <button type="button" class="mini" data-px="4" aria-pressed="false" aria-label="4 pixel cells">4px</button>
    </span>
  </div>
  <div class="grp" role="group" aria-label="Time of day">
    <button type="button" data-time="day" aria-pressed="false">Day</button>
    <button type="button" data-time="dusk" aria-pressed="false">Dusk</button>
    <button type="button" data-time="night" aria-pressed="true">Night</button>
  </div>
  <div class="grp" role="group" aria-label="Weather">
    <button type="button" data-weather="clear" aria-pressed="false">Clear</button>
    <button type="button" data-weather="rain" aria-pressed="true">Rain</button>
    <button type="button" data-weather="snow" aria-pressed="false">Snow</button>
  </div>
  <div class="grp" role="group" aria-label="Store">
    <button type="button" data-toggle="lights" aria-pressed="true">Store lights</button>
    <button type="button" data-toggle="tags" aria-pressed="false">Price tags</button>
  </div>
  <div class="grp" role="group" aria-label="Actions">
    <button type="button" class="act" data-act="feed">Feed Xiangxiang</button>
    <button type="button" class="act" data-act="restock">Restock all</button>
    <button type="button" class="act" data-act="reset">Reset view</button>
  </div>
</nav>

<div id="fail" hidden>This scene needs WebGL. Try a current version of Chrome, Safari, Edge or Firefox.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   0. UTILITIES
   ===================================================================== */
const FONT = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif';
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const NOOP = function () {};
let seed = 20261007;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
function rpick(a) { return a[Math.floor(Math.random() * a.length)]; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function damp(rate, dt) { return 1 - Math.exp(-rate * dt); }
function V(x, y, z) { return new THREE.Vector3(x, y, z); }
function wrapAngle(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
function hex(c) { return '#' + c.toString(16).padStart(6, '0'); }
function yen(n) { return '¥' + n.toLocaleString('ja-JP'); }

function tex(w, h, draw, opt) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  if (opt && opt.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opt.repeat[0], opt.repeat[1]); }
  return t;
}
function pixTex(w, h, draw) {
  const t = tex(w, h, draw); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; return t;
}
function rep(t, a, b) { const c = t.clone(); c.needsUpdate = true; c.wrapS = c.wrapT = THREE.RepeatWrapping; c.repeat.set(a, b); return c; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function star(g, cx, cy, R, r, n) { n = n || 5; g.beginPath(); for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n; const d = i % 2 ? r : R; g.lineTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d); } g.closePath(); }
function font(px, w) { return (w || 800) + ' ' + px + 'px ' + FONT; }

/* =====================================================================
   1. ANCHORS — the few scene dimensions everything else derives from
   ===================================================================== */
const A = {
  half: 12,
  store: { x0: -5, x1: 3.2, z0: -4.6, z1: 3.2, floor: 0.22 },
  door: { x: -0.1, z: 3.1 },
  cat: V(2.55, 1.05, 2.78),
  bowl: V(2.12, 1.05, 2.86),
  stools: [V(1.1, 0.22, 2.2), V(1.8, 0.22, 2.2)],
  clerk: V(-4.22, 0.22, -0.3),
  lamp1: V(7.2, 5.45, 7.2),
  lamp3: V(7.45, 5.25, -9.8),
  homeTheta: 0.72, homePhi: 1.0
};
function groundY(x, z) {
  const s = A.store;
  if (x > s.x0 && x < s.x1 && z > s.z0 && z < s.z1) return s.floor;
  if (x < 3.8 && z < 3.8) return 0.12;
  if (x < 6.6 && z < 6.6) return 0.15;
  if (z > 11.2 || (x > 11.2 && z < 6.6)) return 0.15;
  return 0.0;
}
function indoors(x, z) { const s = A.store; return x > s.x0 && x < s.x1 && z > s.z0 && z < s.z1; }

/* =====================================================================
   2. MATERIALS + PRIMITIVE BUILDERS
   ===================================================================== */
let GRAD, OUTLINE;
const matCache = {};
function initMaterials() {
  const d = new Uint8Array([88, 88, 88, 255, 160, 160, 160, 255, 225, 225, 225, 255, 255, 255, 255, 255]);
  GRAD = new THREE.DataTexture(d, 4, 1, THREE.RGBAFormat);
  GRAD.minFilter = GRAD.magFilter = THREE.NearestFilter; GRAD.generateMipmaps = false; GRAD.needsUpdate = true;
  OUTLINE = new THREE.MeshBasicMaterial({ color: 0x17132e, side: THREE.BackSide });
}
function toon(c, flat) { const k = (flat ? 'f' : 't') + c; if (matCache[k]) return matCache[k]; const m = new THREE.MeshToonMaterial({ color: c, gradientMap: GRAD }); m.flatShading = !!flat; return (matCache[k] = m); }
function basic(c) { const k = 'b' + c; return matCache[k] || (matCache[k] = new THREE.MeshBasicMaterial({ color: c })); }
function toonFlatSide(c) { const m = new THREE.MeshToonMaterial({ color: c, gradientMap: GRAD, side: THREE.DoubleSide }); m.flatShading = true; return m; }
function toonMap(t, c) { return new THREE.MeshToonMaterial({ color: c === undefined ? 0xffffff : c, map: t, gradientMap: GRAD }); }
function litMap(t, extra) { return new THREE.MeshBasicMaterial(Object.assign({ map: t }, extra || {})); }
function M(m) { return (m && (m.isMaterial || Array.isArray(m))) ? m : toon(m); }
function hull(geo) { const h = new THREE.Mesh(geo, OUTLINE); h.raycast = NOOP; h.userData.hull = true; return h; }
const OL = 0.04;

function box(p, w, h, d, mat, x, y, z, o) {
  o = o || {};
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(mat));
  m.position.set(x, y + h / 2, z); if (o.ry) m.rotation.y = o.ry;
  if (o.ol !== false) { const t = o.t !== undefined ? o.t : OL; m.add(hull(new THREE.BoxGeometry(w + 2 * t, h + 2 * t, d + 2 * t))); }
  p.add(m); return m;
}
function cyl(p, rt, rb, h, mat, x, y, z, o) {
  o = o || {}; const seg = o.seg || 16;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, !!o.open), M(mat));
  m.position.set(x, y + h / 2, z); if (o.rx) m.rotation.x = o.rx; if (o.rz) m.rotation.z = o.rz;
  if (o.ol !== false) { const t = o.t !== undefined ? o.t : OL; m.add(hull(new THREE.CylinderGeometry(rt + t, rb + t, h + 2 * t, seg))); }
  p.add(m); return m;
}
function sph(p, r, mat, x, y, z, o) {
  o = o || {};
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, o.seg || 18, o.seg ? Math.ceil(o.seg * 0.7) : 12), M(mat));
  m.position.set(x, y, z); m.scale.set(o.sx || 1, o.sy || 1, o.sz || 1);
  if (o.ol !== false) { const t = o.t !== undefined ? o.t : OL; m.add(hull(new THREE.SphereGeometry(r + t, 14, 10))); }
  p.add(m); return m;
}
function rod(p, a, b, r, mat, t) {
  const dir = new THREE.Vector3().subVectors(b, a); const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), M(mat));
  m.position.addVectors(a, b).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(V(0, 1, 0), dir.normalize());
  if (t) m.add(hull(new THREE.CylinderGeometry(r + t, r + t, len + 2 * t, 8)));
  p.add(m); return m;
}
function flat(p, w, d, mat, x, y, z, yaw) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), M(mat));
  m.rotation.order = 'YXZ'; m.rotation.set(-Math.PI / 2, yaw || 0, 0); m.position.set(x, y, z); p.add(m); return m;
}
function plane(p, w, h, mat, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), M(mat)); m.position.set(x, y, z); if (ry) m.rotation.y = ry; p.add(m); return m;
}
function G(name, parent, x, y, z) { const g = new THREE.Group(); g.name = name; g.position.set(x || 0, y || 0, z || 0); if (parent) parent.add(g); return g; }

/* =====================================================================
   3. LIGHT / GLOW REGISTRY  (environment drives these by category)
   ===================================================================== */
let GLOWTEX;
const FX = [];  // { kind:'op'|'light'|'cone'|'color', o, base, cat, wet, flick }
function glow(p, cat, color, x, y, z, s, op, flick) {
  const m = new THREE.SpriteMaterial({ map: GLOWTEX, color: color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: op });
  const sp = new THREE.Sprite(m); sp.position.set(x, y, z); sp.scale.set(s, s, 1); p.add(sp);
  FX.push({ kind: 'op', o: m, base: op, cat: cat, glow: true, flick: flick }); return sp;
}
function floorGlow(p, cat, color, x, y, z, sx, sz, op, wet) {
  const mat = new THREE.MeshBasicMaterial({ map: GLOWTEX, color: color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: op });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.scale.set(sx, sz, 1); m.renderOrder = 2; m.userData.dynamic = true; m.raycast = NOOP; p.add(m);
  FX.push({ kind: 'op', o: mat, base: op, cat: cat, glow: true, wet: !!wet }); return m;
}
function lightCone(p, cat, color, x, yTop, z, h, r, op) {
  const mat = new THREE.ShaderMaterial({
    uniforms: { color: { value: new THREE.Color(color) }, op: { value: op } },
    vertexShader: 'varying float vY; varying vec3 vN; varying vec3 vV; void main(){ vY = uv.y; vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }',
    fragmentShader: 'uniform vec3 color; uniform float op; varying float vY; varying vec3 vN; varying vec3 vV; void main(){ float rim = pow(abs(dot(vN, vV)), 1.4); gl_FragColor = vec4(color, op * pow(vY, 1.6) * rim); }',
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
  });
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 24, 1, true), mat);
  m.position.set(x, yTop - h / 2, z); m.renderOrder = 3; m.userData.dynamic = true; m.raycast = NOOP; p.add(m);
  FX.push({ kind: 'cone', o: mat, base: op, cat: cat }); return m;
}
function plight(scene, cat, color, i, d, x, y, z, flick) {
  const l = new THREE.PointLight(color, i, d, 1.2); l.position.set(x, y, z); scene.add(l);

  const samples = [];

  samples.push(V(6.15, 8.7, 6.15), V(-8.6, 8.7, 6.15), V(6.15, 8.7, -9.8), V(-11.2, 8.1, 3), V(-12, 6.3, -12), V(-3, 6.3, -8), V(3.8, 4.5, -12));
  function fitHome() {
    const dir = V(Math.sin(A.homePhi) * Math.sin(A.homeTheta), Math.cos(A.homePhi), Math.sin(A.homePhi) * Math.cos(A.homeTheta));
    const target = V(0, 1.5, 0); let dist = 50; const W0 = window.innerWidth, H0 = window.innerHeight;
    const dock = document.getElementById('dock').getBoundingClientRect();
    const yB = -1 + 2 * (dock.height + 30) / H0, yT = 1 - 2 * 70 / H0, xL = -0.94, xR = 0.94;
    const p = V(0, 0, 0), right = V(0, 0, 0), up = V(0, 0, 0), tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    for (let it = 0; it < 6; it++) {
      camera.position.copy(target).addScaledVector(dir, dist); camera.lookAt(target); camera.updateMatrixWorld(); camera.updateProjectionMatrix();
      let mnx = 9, mxx = -9, mny = 9, mxy = -9;
      samples.forEach(function (s) { p.copy(s).project(camera); mnx = Math.min(mnx, p.x); mxx = Math.max(mxx, p.x); mny = Math.min(mny, p.y); mxy = Math.max(mxy, p.y); });
      right.setFromMatrixColumn(camera.matrixWorld, 0); up.setFromMatrixColumn(camera.matrixWorld, 1);
      const cx = (mnx + mxx) / 2, cy = (mny + mxy) / 2, tcx = (xL + xR) / 2, tcy = (yB + yT) / 2;
      target.addScaledVector(right, (cx - tcx) * dist * tanV * camera.aspect).addScaledVector(up, (cy - tcy) * dist * tanV);
      dist *= Math.max((mxx - mnx) / (xR - xL), (mxy - mny) / (yT - yB));
    }
    home.target.copy(target); home.pos.copy(target).addScaledVector(dir, dist);
  }
  ctx.resetView = function () {
    controls.enableDamping = false; controls.update();
    fitHome(); camera.position.copy(home.pos); controls.target.copy(home.target); controls.update(); controls.enableDamping = true; userMoved = false;
  };

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
    if (!userMoved) ctx.resetView();
  }
  window.addEventListener('resize', resize); resize();

  /* picking: click vs drag, hover cursor */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const pickRoots = [ctx.cat.root, ctx.props.vendCold, ctx.props.vendHot, ctx.props.coffee, ctx.director.clerk.root].concat(
    Object.keys(ctx.zones).map(function (k) { return ctx.zones[k].mesh; }), Object.keys(ctx.zones).map(function (k) { return ctx.zones[k].frame; }), ctx.director.npcs.map(function (n) { return n.root; }));
  const occHits = [];
  function pickAt(x, y, occlude) {
    ndc.set(x / window.innerWidth * 2 - 1, -(y / window.innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(pickRoots, true);
    let limit = Infinity;
    if (occlude && hits.length) { occHits.length = 0; occluders.forEach(function (m) { THREE.Mesh.prototype.raycast.call(m, ray, occHits); }); occHits.forEach(function (h) { limit = Math.min(limit, h.distance); }); }
    for (let i = 0; i < hits.length; i++) {
      if (hits[i].distance > limit + 0.05) break;
      let o = hits[i].object, vis = true, a = o; while (a) { if (!a.visible) { vis = false; break; } a = a.parent; } if (!vis) continue;
      while (o && !o.userData.pick) o = o.parent;
      if (!o) continue;
      const info = o.userData.pick;
      if (info.kind === 'zone' && hits[i].object !== info.zone.mesh) {
        for (let j = i + 1; j < hits.length; j++) if (hits[j].object === info.zone.mesh && hits[j].distance - hits[i].distance < 0.8) return { info: info, hit: hits[j] };
      }
      return { info: info, hit: hits[i] };
    }
    return null;
  }
  let down = null, hoverT = 0;
  canvas.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener('pointerup', function (e) {
    if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
    if (moved > 6 || dt > 600) return;
    const r = pickAt(e.clientX, e.clientY, true);
    if (!r) { ctx.ui.close(); return; }
    const info = r.info;
    if (info.kind === 'cat') ctx.ui.open({ kind: 'cat' }, function () { return V(A.cat.x, A.cat.y + 0.8, A.cat.z); });
    else if (info.kind === 'zone') {
      const z = info.zone; let item = null;
      if (r.hit.object === z.mesh && r.hit.instanceId !== undefined) item = z.items[z.slots[r.hit.instanceId].item];
      ctx.ui.open({ kind: 'zone', zone: z, item: item }, item ? r.hit.point.clone() : z.anchor);
    }
    else if (info.kind === 'list') ctx.ui.open({ kind: 'list', key: info.key }, r.hit.point.clone());
    else if (info.kind === 'npc') { const n = info.npc; ctx.ui.open({ kind: 'npc', npc: n }, function () { return V(n.pos.x, n.pos.y + 1.7, n.pos.z); }); }
    else if (info.kind === 'clerk') ctx.ui.open({ kind: 'clerk' }, V(A.clerk.x, 2.0, A.clerk.z));
  });
  canvas.addEventListener('pointermove', function (e) {
    if (e.buttons || e.pointerType !== 'mouse') return; const now = performance.now(); if (now - hoverT < 70) return; hoverT = now;
    canvas.classList.toggle('hover', !!pickAt(e.clientX, e.clientY));
  });

  /* loop */
  const clock = new THREE.Clock(); let time = 0, uiT = 0;
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05); time += dt;
    controls.update();
    ctx.env.update(dt, time);
    ctx.precip.update(dt, time);
    ctx.director.update(dt);
    ctx.cat.update(dt);
    ctx.hearts.update(dt);
    Object.keys(ctx.zones).forEach(function (k) { ctx.zones[k].update(dt); });
    const dr = REF.doors, want = ctx.director.nearDoor() ? 1 : 0;
    dr.open += clamp(want - dr.open, -dt * 2.2, dt * 2.2);
    const o = dr.open * dr.open * (3 - 2 * dr.open); dr.L.position.x = -0.55 - 0.82 * o; dr.R.position.x = 0.34 + 0.82 * o;
    ctx.pipe.render(scene, camera, dt, window.innerWidth, window.innerHeight);
    ctx.ui.update(); uiT += dt; if (uiT > 0.3) { uiT = 0; ctx.ui.stats(); }
    requestAnimationFrame(frame);
  }
  window.__hoshi = { ctx: ctx, batched: batched };
  requestAnimationFrame(frame);
}

const fontsReady = (document.fonts && document.fonts.load)
  ? Promise.race([Promise.all([document.fonts.load('800 64px "M PLUS Rounded 1c"', 'ほしマート止まれ香夜猫'), document.fonts.load('700 64px "M PLUS Rounded 1c"', 'HOSHI')]), new Promise(function (r) { setTimeout(r, 2500); })]).catch(NOOP)
  : Promise.resolve();
window.__hoshiStart = start;
fontsReady.then(function () { if (!window.__noStart) start(); });
})();
</script>
